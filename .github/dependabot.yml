version: 2
updates:
  # Gradle dependencies, plugins & wrapper (build.gradle.kts, gradle-wrapper.properties)
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "io.spring.dependency-management*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlin.*"
      spring-cloud-aws:
        patterns:
          - "io.awspring.cloud*"
      test:
        patterns:
          - "org.junit*"
          - "*test*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
